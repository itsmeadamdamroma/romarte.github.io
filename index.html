<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RomArte Studio — Luxury Interior Design, 3D Architectural CGI & Turnkey Fit-Out</title>
  <meta name="description" content="Official showcase for RomArte Studio. Architectural practice fusing Italian spatial heritage with German precision engineering across Cairo, Rome, and Dubai.">
  <link rel="canonical" href="https://romartestudio.com/">
  <meta property="og:title" content="RomArte Studio — Architectural Design & Visualization">
  <meta property="og:description" content="Bespoke interior architecture, 8K CGI visualization, and turnkey fit-out engineering in Cairo, Rome, and Dubai.">
  <meta property="og:url" content="https://romartestudio.com/">
  <meta property="og:type" content="website">
  <meta http-equiv="refresh" content="2;url=https://romartestudio.com/">
  <style>
    :root {
      --bg: #0d0f12;
      --card: #15181e;
      --border: #222731;
      --gold: #d4af37;
      --text: #f0f2f5;
      --text-muted: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 580px;
      width: 100%;
      padding: 40px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .badge {
      display: inline-block;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 20px;
      font-weight: 600;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }
    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      background: var(--gold);
      color: #0d0f12;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.5px;
      padding: 12px 28px;
      border-radius: 8px;
      transition: opacity 0.2s ease;
    }
    .btn:hover { opacity: 0.9; }
    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">RomArte Studio</div>
    <h1>Spatial Architecture & 3D CGI</h1>
    <p>Fusing Italian architectural heritage with precision engineering across Cairo, Rome, and Dubai. Redirecting you to our official platform...</p>
    <a href="https://romartestudio.com/" class="btn">Enter romartestudio.com</a>
    <div class="footer-note">Redirecting automatically. Click the button above if not redirected.</div>
  </div>
</body>
</html>
